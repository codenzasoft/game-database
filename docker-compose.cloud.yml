services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    command:
      - "crafty-dynamics-495319-e2:us-central1:codenza-games-db"
      - "--address=0.0.0.0"
      - "--port=5432"
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/adc.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/adc.json

  flyway:
    image: flyway/flyway:11.0.1-alpine
    command: -configFiles=/flyway/conf/cloud-flyway.config -locations=filesystem:/flyway/sql -connectRetries=10 migrate
    volumes:
      - ${PWD}/migrations:/flyway/sql
      - ${PWD}/config:/flyway/conf
    environment:
      FLYWAY_PASSWORD: ${CLOUD_DB_PASSWORD}
    depends_on:
      - cloud-sql-proxy

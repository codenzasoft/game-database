name: Migration Check

on:
  pull_request:
    branches: [main]
    paths:
      - migrations/**

jobs:
  migration-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Start Cloud SQL Auth Proxy
        run: |
          docker network create flyway-net
          docker run -d \
            --name cloud-sql-proxy \
            --network flyway-net \
            gcr.io/cloud-sql-connectors/cloud-sql-proxy:2 \
            crafty-dynamics-495319-e2:us-central1:codenza-games-db \
            --address=0.0.0.0 --port=5432 \
            --token="$(gcloud auth print-access-token)"
          sleep 5

      - name: Validate migrations
        run: |
          docker run --rm \
            --network flyway-net \
            -v ${{ github.workspace }}/migrations:/flyway/sql \
            flyway/flyway:11.0.1-alpine \
            -url="jdbc:postgresql://cloud-sql-proxy:5432/postgres" \
            -user=postgres \
            -password="${{ secrets.CLOUD_DB_PASSWORD }}" \
            -locations=filesystem:/flyway/sql \
            -connectRetries=10 \
            validate

      - name: Show migration status
        if: always()
        run: |
          docker run --rm \
            --network flyway-net \
            -v ${{ github.workspace }}/migrations:/flyway/sql \
            flyway/flyway:11.0.1-alpine \
            -url="jdbc:postgresql://cloud-sql-proxy:5432/postgres" \
            -user=postgres \
            -password="${{ secrets.CLOUD_DB_PASSWORD }}" \
            -locations=filesystem:/flyway/sql \
            info

      - name: Proxy logs
        if: failure()
        run: docker logs cloud-sql-proxy
